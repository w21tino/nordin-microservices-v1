# ─────────────────────────────────────────────
# Perfil de test — Solo activo con @ActiveProfiles("test")
#
# Reemplaza PostgreSQL por H2 en memoria para tests unitarios.
# En CI/CD este perfil se omite y se usa Testcontainers
# con PostgreSQL real para validación final.
# ─────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:emp_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Deshabilitar Config Server en tests
  config:
    import: "optional:configserver:"

  # Deshabilitar Eureka en tests
  cloud:
    config:
      enabled: false
