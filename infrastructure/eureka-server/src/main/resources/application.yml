server:
  port: 8761

spring:
  application:
    name: eureka-server

  # Obtiene configuración del Config Server
  config:
    import: optional:configserver:http://${CONFIG_USER:config-user}:${CONFIG_PASS:config-pass}@${CONFIG_HOST:localhost}:8888

  security:
    user:
      name: ${EUREKA_USER:eureka-user}
      password: ${EUREKA_PASS:eureka-pass}

# ─────────────────────────────────────────────
# Configuración standalone del Eureka Server
# No se registra a sí mismo ni busca peers
# en un ambiente de desarrollo single-node
# ─────────────────────────────────────────────
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${EUREKA_USER:eureka-user}:${EUREKA_PASS:eureka-pass}@${eureka.instance.hostname}:${server.port}/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false  # Solo en desarrollo

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Eureka Server
    description: Registro y descubrimiento de servicios
    version: 1.0.0
